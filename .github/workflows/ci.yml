name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一個分支連續推送時，取消還在跑的舊流程，不要浪費 runner 時間
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write      # 讓測試報告能建立 check run
    # ubuntu runner 內建 Docker，Testcontainers 會自己起 MySQL，所以這裡不用宣告 service 容器
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # 快取 ~/.m2，第二次之後不用重新下載依賴
          cache: maven

      - name: Run tests
        # 時區要跟正式環境一致：每日統計是用伺服器時區切分日期的
        env:
          TZ: Asia/Taipei
        run: ./mvnw -B verify

      # 這一步是為了防止「綠燈但其實沒測到」：
      # Testcontainers 連不上 Docker 時會把測試標成 skipped 而不是失敗，建置照樣成功。
      # 本機就踩過一次，4 個資料庫測試整整被略過還顯示通過，所以這裡直接把 skipped 當失敗。
      - name: Verify no tests were skipped
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = skipped = failures = errors = 0
          for path in glob.glob('target/surefire-reports/TEST-*.xml'):
              suite = ET.parse(path).getroot()
              total += int(suite.get('tests', 0))
              skipped += int(suite.get('skipped', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
          print(f'tests={total} skipped={skipped} failures={failures} errors={errors}')
          if total == 0:
              sys.exit('沒有任何測試被執行')
          if skipped:
              sys.exit(f'有 {skipped} 個測試被略過，CI 不接受略過的測試')
          PY

      - name: Publish test report
        # 失敗時更需要看報告，所以不管前面成敗都執行
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: Test report

  frontend:
    name: Build and test frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 而不是 npm install：嚴格照 lock 檔安裝，CI 的結果才可重現
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        # runner 內建 Chrome，用關掉沙箱的 headless launcher
        run: npm run test:ci

      - name: Build
        run: npm run build

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        # 只驗證映像檔建得起來，不推到 registry
        run: docker build -t short-url-service:ci .

      - name: Build frontend image
        run: docker build -t short-url-web:ci ./frontend
