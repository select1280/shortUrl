name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一個分支連續推送時，取消還在跑的舊流程，不要浪費 runner 時間
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # ubuntu runner 內建 Docker，Testcontainers 會自己起 MySQL，所以這裡不用宣告 service 容器
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # 快取 ~/.m2，第二次之後不用重新下載依賴
          cache: maven

      - name: Run tests
        # 時區要跟正式環境一致：每日統計是用伺服器時區切分日期的
        env:
          TZ: Asia/Taipei
        run: ./mvnw -B verify

      - name: Publish test report
        # 失敗時更需要看報告，所以不管前面成敗都執行
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # 只驗證映像檔建得起來，不推到 registry
        run: docker build -t short-url-service:ci .
