# 正式環境設定：所有憑證一律從環境變數注入，不寫進版控。
# DB_USERNAME / DB_PASSWORD 沒給值時會啟動失敗，這是刻意的 —— 避免誤用預設帳密上線。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:short_url}?useSSL=true&serverTimezone=Asia/Taipei
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # prod 不讓 Hibernate 動結構，schema 變更走 db/schema.sql 或 migration 工具
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis 沒回應時快速放棄，退回查 DB，不要把請求卡在這裡
      timeout: ${REDIS_TIMEOUT:500ms}

springdoc:
  # 正式環境預設關掉 API 文件：它會把所有端點、參數與錯誤碼攤開給任何人看，
  # 等於免費奉送一份攻擊指南。需要時再用環境變數個別打開。
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  # 正式環境通常在反向代理（Nginx / 雲端 LB）後面，request.getRemoteAddr() 拿到的會是代理的 IP。
  # native 會交給 Tomcat 的 RemoteIpValve 從 X-Forwarded-For 還原真實 IP，
  # 而且預設只信任內網代理送來的標頭，外部偽造的 X-Forwarded-For 不會被採信。
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.pokai.shorturl: INFO
