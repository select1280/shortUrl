# 正式環境設定：所有憑證一律從環境變數注入，不寫進版控。
# DB_USERNAME / DB_PASSWORD 沒給值時會啟動失敗，這是刻意的 —— 避免誤用預設帳密上線。
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:short_url}?useSSL=true&serverTimezone=Asia/Taipei
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    hibernate:
      # prod 不讓 Hibernate 動結構，schema 變更走 db/schema.sql 或 migration 工具
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Redis 沒回應時快速放棄，退回查 DB，不要把請求卡在這裡
      timeout: ${REDIS_TIMEOUT:500ms}

logging:
  level:
    root: INFO
    com.pokai.shorturl: INFO
