spring:
  application:
    name: short-url-service

  # 沒指定 --spring.profiles.active 時預設跑 dev，讓 clone 下來就能直接啟動
  profiles:
    default: dev

  jpa:
    # 關掉 OSIV：讓 lazy loading 的邊界留在 service 層，避免 Controller 才觸發查詢
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # 依 Controller 裡 @Tag 的宣告順序排列，不要用字母序
    tags-sorter: alpha
    operations-sorter: method

# 短網址服務設定（前綴用於組回傳的短網址，Base62 編碼長度不足時左補 0）
app:
  short-url:
    base-url: ${SHORT_URL_BASE_URL:http://localhost:8080/}
    code-length: ${SHORT_URL_CODE_LENGTH:6}
    cache:
      enabled: ${CACHE_ENABLED:true}
      # 短碼對應網址的快取時間
      ttl: ${CACHE_TTL:1h}
      # 「查無此短碼」的快取時間，刻意很短，用來擋快取穿透
      null-ttl: ${CACHE_NULL_TTL:60s}
      # Redis 失敗後跳過 Redis 的時間，避免每個請求都卡在 timeout
      circuit-open-duration: ${CACHE_CIRCUIT_OPEN_DURATION:30s}
