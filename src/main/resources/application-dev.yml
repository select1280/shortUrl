# 本機開發用設定，對應 docker-compose.yml 起的 MySQL / Redis。
# 這裡的帳密只是本機容器的固定值，不是真實環境憑證。
spring:
  datasource:
    # port 跟 docker-compose.yml 讀同一個 MYSQL_PORT；
    # allowPublicKeyRetrieval：MySQL 8 預設 caching_sha2_password + 不走 SSL 時必須開，否則容器重啟後連不上
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/short_url?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
    username: shorturl
    password: shorturl_pw
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # dev 讓 Hibernate 自動補結構，開發期改 entity 比較快
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379
      # Redis 沒回應時快速放棄，退回查 DB，不要把請求卡在這裡
      timeout: 500ms

logging:
  level:
    com.pokai.shorturl: DEBUG
